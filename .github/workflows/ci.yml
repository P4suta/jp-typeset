name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  MISE_AUTO_INSTALL: "false"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          base: ${{ github.event.merge_group.base_sha || github.event.repository.default_branch }}
          filters: .github/filters/ci.yml
      - name: Validate selection
        env:
          BROWSER: ${{ steps.changes.outputs.browser }}
        run: test "$BROWSER" = true || test "$BROWSER" = false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: v2026.10.17
          install_args: node pnpm just lefthook github:crate-ci/typos
      - name: Locate the dependency store
        id: store
        run: echo "path=$(mise x -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: mise x -- pnpm install --frozen-lockfile
      - run: mise x -- just ci-fast
      - name: Build the browser environment
        if: steps.changes.outputs.browser == 'true'
        run: docker compose build
      - name: Prepare disposable browser workspace
        if: steps.changes.outputs.browser == 'true'
        run: |
          sudo chown -R 1000:1000 .
          docker compose run --rm -T dev pnpm install --frozen-lockfile
      - name: Check browser behavior
        id: browsers
        if: steps.changes.outputs.browser == 'true'
        run: docker compose run --rm -T dev pnpm run test:gate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure() && steps.browsers.outcome == 'failure'
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7

  required:
    name: required
    if: always()
    needs: [check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require completed checks
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: test "$CHECK_RESULT" = success
